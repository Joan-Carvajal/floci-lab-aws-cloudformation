
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"  # Unified gateway (same port as LocalStack)
    environment:
      - SERVICES=s3,sqs,lambda,apigateway,secretsmanager,cloudformation,iam,logs
      - DEBUG=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/floci
      - ./cloudformation:/etc/floci/init/ready.d/cloudformation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network
    
  postgres:
    image: postgres:16
    container_name: lab-postgres
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  postgres-data:
  floci-data:

